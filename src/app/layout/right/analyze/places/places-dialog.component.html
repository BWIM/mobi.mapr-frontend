<div class="w-full max-w-full h-[85vh] flex flex-col relative">
  <!-- Overlay Close Button -->
  <button 
    type="button"
    class="absolute -top-4 -right-4 w-10 h-10 rounded-full bg-[var(--primary-color)] cursor-pointer flex items-center justify-center z-[1000] shadow-lg transition-all duration-200 ease-in-out hover:scale-110 hover:shadow-xl active:scale-95 border-[var(--background-color)] border-2"
    (click)="onClose()"
    aria-label="Close">
    <span class="text-[var(--secondary-color)] text-[28px] font-bold leading-none m-0 p-0">×</span>
  </button>
  
  <h2 mat-dialog-title class="text-2xl font-bold text-white mb-4">
    {{ categoryName }}
  </h2>
  
  <mat-dialog-content class="mat-typography flex-1 overflow-hidden py-4 flex flex-col min-h-0">
    <div class="flex flex-1 min-h-0 gap-3 flex-col lg:flex-row">
      <!-- Map -->
      <div class="relative flex-1 min-h-[240px] min-w-0 h-full">
        <div #mapContainerPlaces class="w-full h-full"></div>
        
        <div *ngIf="isLoading" class="absolute inset-0 bg-[var(--background-color)] bg-opacity-95 text-sm text-[var(--primary-color)] flex items-center justify-center" style="z-index: 2000;">
          <div class="flex flex-col items-center gap-4">
            <mat-spinner diameter="40"></mat-spinner>
            <p>{{ 'analyze.placesDialog.loading' | translate }}</p>
          </div>
        </div>
        
        <div *ngIf="error && !isLoading" class="absolute inset-0 bg-[var(--background-color)] bg-opacity-95 text-sm text-[var(--primary-color)] py-4 text-center flex items-center justify-center" style="z-index: 2000;">
          <div class="px-4">{{ error }}</div>
        </div>
      </div>

      <!-- Composition / activity list (also serves as legend) -->
      <aside
        *ngIf="!isLoading && !error && (composition || categoryLegendItems.length > 0)"
        class="composition-side w-full lg:w-72 xl:w-80 shrink-0 max-h-[42%] lg:max-h-none overflow-y-auto rounded-lg bg-[var(--background-color)] bg-opacity-70 border border-[var(--primary-color)] border-opacity-30 p-3">
        <app-category-composition-panel
          *ngIf="composition; else flatLegend"
          [node]="composition"
          [showHeader]="true"
          [interactive]="true"
          [activityMeta]="compositionActivityMeta"
          [overallMetricLabel]="overallMetricLabel"
          [overallMetricColor]="overallMetricColor"
          [highlightedActivityName]="highlightedActivityName"
          [formatMetric]="formatCompositionMetric"
          (toggleActivity)="onPanelActivitySelect($event)"
          (hoverActivity)="onPanelActivityHover($event)">
        </app-category-composition-panel>

        <ng-template #flatLegend>
          <div class="text-xs font-semibold uppercase tracking-wide opacity-75 mb-2 text-[var(--primary-color)]">
            {{ 'analyze.categories' | translate }}
          </div>
          <div *ngIf="overallMetricLabel" class="flex items-baseline justify-between gap-2 mb-2 px-1.5 py-1 rounded border border-[var(--primary-color)] border-opacity-25 bg-[var(--primary-color)] bg-opacity-10 text-[var(--primary-color)]">
            <span class="text-[11px] font-semibold opacity-85">{{ 'analyze.composition.overall' | translate }}</span>
            <span class="text-sm font-bold tabular-nums" [style.color]="overallMetricColor || null">{{ overallMetricLabel }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <button
              type="button"
              *ngFor="let item of categoryLegendItems"
              class="flex items-center gap-2 text-left w-full px-1.5 py-1 border-0 bg-transparent cursor-pointer transition-colors text-[var(--primary-color)] rounded"
              [class.legend-row-highlighted]="highlightedActivityName === item.name"
              (click)="onPanelActivitySelect(item.name)"
              (mouseenter)="onPanelActivityHover(item.name)"
              (mouseleave)="onPanelActivityHover(null)">
              <span class="text-[12px] leading-snug min-w-0 flex-1 truncate">
                {{ item.name }} ({{ item.relevance | number:'1.0-0' }}%)
              </span>
              <span
                class="text-[11px] shrink-0 tabular-nums"
                [style.color]="getPlacesMetricTextColor(item.score, item.index)">
                <ng-container *ngIf="getPlacesIsScoreMode(); else flatIndexMode">
                  {{ (item.score / 60) | number:'1.1-1' }} {{ 'map.popup.minutes' | translate }}
                </ng-container>
                <ng-template #flatIndexMode>
                  {{ getGradeFromIndex(item.index) }}
                </ng-template>
              </span>
            </button>
          </div>
        </ng-template>
      </aside>
    </div>
  </mat-dialog-content>

  <!-- Bottom: quality / time scale only -->
  <div class="flex-shrink-0 border-t border-[var(--primary-color)] border-opacity-30 pt-3 px-4 pb-2" *ngIf="!isLoading && !error">
    <div class="cursor-pointer" (click)="openLegendInfo()">
      <div class="w-full" *ngIf="!getPlacesIsScoreMode()">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-full flex items-center justify-center border border-white/40" *ngFor="let item of qualityColors" [style.background-color]="item.color">
            <span class="text-sm font-bold text-white">{{ item.letter }}</span>
          </div>
        </div>
      </div>

      <div class="w-full" *ngIf="getPlacesIsScoreMode() && hasScoreColors()">
        <div class="flex flex-col gap-1.5 w-full max-w-xl">
          <div class="flex w-full h-3 overflow-hidden rounded">
            <div class="flex-1" *ngFor="let item of timeLegendItems()" [style.background-color]="item.color"></div>
          </div>
          <div class="flex justify-between">
            <span class="text-xs text-white flex-1 min-w-0 text-center" *ngFor="let item of timeLegendItems()">
              {{ item.segmentLabel }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
