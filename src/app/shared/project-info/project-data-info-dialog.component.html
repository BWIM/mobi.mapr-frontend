<div class="flex flex-col min-w-[85vw] sm:min-w-[420px] max-w-[95vw] sm:max-w-[640px]">
  <h2 mat-dialog-title class="text-xl sm:text-2xl font-semibold text-[var(--primary-color)] m-0 px-2 flex items-center gap-2">
    <mat-icon class="text-2xl">storage</mat-icon>
    {{ 'projectInfo.dataInfo.title' | translate }}
  </h2>

  <mat-dialog-content class="mat-typography max-h-[70vh] overflow-y-auto py-4 px-2 sm:px-4">
    @if (data.licenseInfo; as license) {
      <p class="m-0 text-sm sm:text-base leading-relaxed whitespace-pre-line text-[var(--primary-color)] break-words [overflow-wrap:anywhere]">
        {{ license }}
      </p>
    } @else {
      <p class="m-0 text-sm sm:text-base leading-relaxed text-[var(--primary-color)]">
        {{ 'projectInfo.dataInfo.openStreetMapFallback' | translate }}
      </p>
      <a
        href="https://www.openstreetmap.org/copyright"
        target="_blank"
        rel="noopener noreferrer"
        class="mt-3 inline-flex items-center gap-2 text-sm font-medium text-[var(--primary-color)] underline underline-offset-2 transition-opacity hover:opacity-80">
        <mat-icon class="text-sm">open_in_new</mat-icon>
        <span>openstreetmap.org/copyright</span>
      </a>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="px-2 sm:px-4 pt-4 mt-2 border-t border-black/12">
    <button mat-button (click)="close()">
      {{ 'projectInfo.dataInfo.close' | translate }}
    </button>
  </mat-dialog-actions>
</div>
