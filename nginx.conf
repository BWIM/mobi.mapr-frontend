worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Compress text responses on the fly (HTML is always included by nginx).
    # Fonts (woff2) and images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        text/plain;
    # Enable once the Docker build precompresses files (F-12):
    # gzip_static on;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Content-hashed build output (outputHashing: all): main-XXXX.js, chunk-XXXX.js,
        # styles-XXXX.css, media/*. A new build gets new names, so cache forever.
        # Missing files must 404 (not fall back to index.html), or a stale chunk name would
        # get HTML cached for a year.
        location ~* ^/[^/]+\.(?:js|css)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /media/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Written at container start (maintenance mode): always revalidate.
        location = /assets/config.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        # Translations are not content-hashed and change with releases: revalidate (ETag)
        # so a deploy is picked up immediately instead of after a week.
        location /assets/i18n/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        # Fonts and images: stable names, cache for a week.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800";
        }

        # index.html and SPA deep links (/dashboard?…): always revalidate so a new
        # deploy's hashed bundles are referenced right away.
        location / {
            index index.html;
            try_files $uri $uri/ /index.html =404;
            add_header Cache-Control "no-cache";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
